# Path Watch
watch:
  - custom_theme
  - ../src
  - ./docs

# Extras
extra:
  generator: false

# Theme
theme:
  custom_dir: custom_theme/
  name: material
  locale: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
  icon:
    logo: material/webhook
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Extensions
markdown_extensions:
  # - footnotes
  - admonition
  - tables
  - attr_list
  # base_path: the repo root (builds run from docs/), so pages can include the
  # *tested* example sources verbatim; check_paths: a missing include fails the
  # build instead of silently rendering an empty block.
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.tasklist:
      custom_checkbox: true

# Plugins
plugins:
  - search
  - macros
  - termynal
  - autorefs

  # mkdocstrings
  - mkdocstrings:
      handlers:
        python:
          paths: [../src] # search packages in the src folder
          options:
            # Docstring Style
            docstring_style: google
            docstring_section_style: list # table | list | spacy

            # Symbol
            show_symbol_type_toc: true
            show_symbol_type_heading: false

            # Headings
            show_root_heading: true
            separate_signature: false

            # Generic
            allow_inspection: true
            group_by_category: true
            show_bases: false
            show_labels: true
            show_source: false
            unwrap_annotated: true

            # Members
            members_order: source
            inherited_members: false

            # Object Paths
            show_root_members_full_path: false
            show_object_full_path: false

            # Init
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: true

            # Docstring Include
            show_docstring_functions: true
            show_docstring_examples: true
            show_if_no_docstring: false

            # Filters
            filters:
              - "!^_"
