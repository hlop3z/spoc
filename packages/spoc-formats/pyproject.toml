[project]
name = "spoc-formats"
version = "0.5.0"
description = "Read, write, collect, and address structured data — one JSON-model representation across formats"
readme = "README.md"
license = "MIT"
authors = [
    { name = "hlop3z", email = "23062270+hlop3z@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["formats", "json", "yaml", "toml", "xml", "csv", "jsonpath"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# The bare install reads JSON, CSV, and TOML through the standard library and
# costs nothing. Every non-stdlib codec lives behind an extra below.
dependencies = []

[project.urls]
Homepage = "https://hlop3z.github.io/spoc/"
Repository = "https://github.com/hlop3z/spoc"
Changelog = "https://github.com/hlop3z/spoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.19.1"] # YAML 1.2, a strict JSON superset (design.md D6)
xml = ["xmltodict>=1.0.4"]     # force_list's callable form is what D3 needs
toml = ["tomli-w>=1.0"]        # stdlib tomllib reads; nothing in it writes
# python-jsonpath carries RFC 9535 + RFC 6901; iregexp-check is what makes the
# RFC's own match()/search() functions available, so conformance is not partial.
query = ["python-jsonpath>=2.2.1", "iregexp-check>=0.1.4"]
full = ["spoc-formats[yaml,xml,toml,query]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests"]
