# Application Configuration — the only file the kernel reads.
[spoc]
mode = "development" # options: development, staging, production
debug = true

# Installed Apps by Mode (development cascades staging and production in)
[spoc.apps]
production = ["auth"]
staging = ["another"]
development = ["demo", "other"]

# Additional Components (Plugins and Hooks)
[spoc.plugins]
middleware = ["demo.extras.middleware"]
hooks = ["demo.extras.hook"]
