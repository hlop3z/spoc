# Application Configuration — the only file the kernel reads.
[spoc]
mode = "development" # the default mode set; extend it under [spoc.modes]
debug = true

# Installed apps by mode, each a dotted module path imported exactly as
# written (development cascades staging and production in).
[spoc.apps]
production = ["apps.auth"]
staging = ["apps.another"]
development = ["apps.demo", "apps.other"]

# Additional components (plugins and hooks), each a resolvable reference.
# The segment before the module is the namespace (a top-level module is its
# own): extras.middleware registers as middleware:extras.middleware, and
# apps.demo.extras.hook would register as hooks:demo.hook.
[spoc.plugins]
middleware = ["extras.middleware"]
hooks = ["extras.hook"]
