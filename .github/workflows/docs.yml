name: Update Docs

on:
  workflow_dispatch: # Allows manual triggering
  # Called by release.yml after publishing, NOT triggered by the `release`
  # event. A release created with the default GITHUB_TOKEN raises no event that
  # starts another workflow — GitHub's recursion guard — so a `release:
  # published` trigger here would sit silent through every release and the site
  # would only ever move when someone remembered to dispatch it by hand. It did
  # exactly that, until the published docs were several releases behind the code.
  workflow_call:
    inputs:
      tag:
        description: The release tag the docs are being built for.
        required: false
        type: string

permissions:
  contents: write # Grants write permissions to push changes to the repository

jobs:
  update_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Exact pin: setup-uv publishes no floating major tag past v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Dependencies
        run: uv sync --group docs

      # The tag arrives from the caller; a manual dispatch has none, and then the
      # repo_url stays as committed rather than being rewritten to point at
      # `tree/` with nothing after it.
      - name: Update mkdocs.yml with Latest Tag
        if: inputs.tag != ''
        run: |
          cd docs
          sed -i "s|repo_url: https://github.com/${{ github.repository }}/.*|repo_url: https://github.com/${{ github.repository }}/tree/${{ inputs.tag }}|" mkdocs.yml

      - name: Deploy MkDocs
        working-directory: docs
        run: uv run mkdocs gh-deploy --force
