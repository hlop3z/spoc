name: CI

# Runs the canonical validation suite from .canon/checks.md.
# Also callable from other workflows (release gates on this).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Exact pin: setup-uv publishes no floating major tag past v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # --group examples: the reference-application spec requires the HTTP
      # projection test to genuinely construct the app in CI, never skip.
      - name: Install Dependencies
        run: uv sync --locked --group examples

      - name: Formatter
        run: uv run ruff format --check .

      - name: Linter
        run: uv run ruff check

      - name: Type checker
        run: uv run ty check

      - name: Unit tests
        run: uv run pytest

  go:
    name: Go workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: scripts/go/go.mod
          cache-dependency-path: scripts/go/go.sum

      - name: Vet
        working-directory: scripts/go
        run: go vet ./...

      - name: Build
        working-directory: scripts/go
        run: go build -o bin/ ./...

  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # --all-packages: a root sync alone skips workspace members (scripts/README.md)
      - name: Install Workspace Tools
        working-directory: scripts/py
        run: uv sync --locked --all-packages

      - name: Check Markdown links
        working-directory: scripts/py
        run: uv run mdlinks ../..

      - name: Check the API surface against the stability contract
        working-directory: scripts/py
        run: uv run apicheck ../..

      # The root pytest run is pinned to tests/ and cannot reach these.
      - name: Workshop tool tests
        working-directory: scripts/py
        run: uv run pytest tools/
