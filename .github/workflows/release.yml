name: Upload Release to PyPI

on:
  workflow_dispatch: # Manually triggered
  push:
    tags:
      - v* # Automatically triggered on tags that match the pattern

permissions:
  contents: write # Required to create releases

jobs:
  checks:
    name: Validation suite
    uses: ./.github/workflows/ci.yml

  pypi-publish:
    name: Publish to PyPI
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # This permission is needed for creating releases and private repositories.
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Exact pin: setup-uv publishes no floating major tag past v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        run: uv publish

      # The release notes are the CHANGELOG section for this tag — one home, and the
      # empty check means a forgotten entry blocks the release instead of publishing
      # a release body that says nothing.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # index() rather than a dynamic regex: `[` and `]` in a regex built from a
          # string would form a character class, silently matching nothing.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1    { found = 1; next }
            found && index($0, "## [") == 1   { exit }
            found && index($0, "]: http") > 0 { next }   # link definitions
            found                             { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — add one before tagging."
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
