[project]
name = "spoc"
dynamic = ["version"]
description = "Registry-first runtime kernel for modular monolithic Python applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hlop3z", email = "23062270+hlop3z@users.noreply.github.com" },
]
requires-python = ">=3.13"
keywords = ["framework", "kernel", "registry", "modular-monolith", "plugins"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://hlop3z.github.io/spoc/"
Documentation = "https://hlop3z.github.io/spoc/"
Repository = "https://github.com/hlop3z/spoc"
Changelog = "https://github.com/hlop3z/spoc/blob/main/CHANGELOG.md"

# The scaffolder ships in this distribution and needs nothing: every one of its
# build-vs-adopt decisions landed on the standard library, so `dependencies`
# above stays empty. The kernel imports nothing from `spoc.scaffold`.
[project.scripts]
spoc = "spoc.scaffold.cli:main"

# `spoc.formats` is the second sidecar, on the same contract: the kernel imports
# nothing from it, and everything it adopts is quarantined here so `dependencies`
# above stays empty. JSON, CSV, and TOML *reading* are standard library and cost
# nothing — installing spoc bare still reads all three.
[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.19.1"] # YAML 1.2, a strict JSON superset (design.md D6)
xml = ["xmltodict>=1.0.4"]     # force_list's callable form is what D3 needs
toml = ["tomli-w>=1.0"]        # stdlib tomllib reads; nothing in it writes
# python-jsonpath carries RFC 9535 + RFC 6901; iregexp-check is what makes the
# RFC's own match()/search() functions available, so conformance is not partial.
query = ["python-jsonpath>=2.2.1", "iregexp-check>=0.1.4"]
full = ["spoc[yaml,xml,toml,query]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/spoc/__about__.py"

# The sdist is the package, its tests, and its history — not the docs site, the
# process artifacts, or the built distributions. README, LICENSE, and pyproject
# are included by hatchling on its own.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

# Ruff runs on an explicit rule selection, never its defaults: a toolchain bump must
# not silently change what CI enforces (.canon/checks.md is the gate).
# `include` is ruff's default list minus `*.md` — 0.16 began formatting Python inside
# Markdown, which reflows the aligned trailing comments the docs use as annotations.
[tool.ruff]
target-version = "py313"
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — this project is >=3.13; legacy typing spellings are defects
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DTZ", # flake8-datetimez — naive datetimes are a correctness trap
    "RUF", # ruff-specific
]
ignore = [
    # `__all__` is grouped by concern with section comments (Framework, Registry,
    # Identity, …). That grouping is the public surface's table of contents; sorting
    # it alphabetically would flatten a deliberate structure into noise.
    "RUF022",
]

[tool.ty.environment]
root = ["./src"]

# Note: unresolved-import ignored due to ty bug with Windows path case sensitivity
# See: https://github.com/astral-sh/ty/issues - GitHub vs github in path
[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    # Devs Tools
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    # tests/test_formats.py exercises the real codecs and simulates a *missing* extra
    # with a stub factory — so the extras must be present for the suite to mean
    # anything. Declared here rather than as a CI flag: `uv sync` installs the dev
    # group by default, so a plain sync gives CI and a laptop the same environment.
    # This never reaches an installer of `spoc` — `dependencies` above stays empty.
    "spoc[full]",
]
examples = [
    # HTTP surface for the registry-projection example (never a kernel dependency)
    "fastapi>=0.115",
]
docs = [
    # Docs Tools
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocstrings[python]>=1.0.0",
    "termynal>=0.13.0",
]
