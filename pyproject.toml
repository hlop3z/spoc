[project]
name = "spoc"
dynamic = ["version"]
description = "Registry-first runtime kernel for modular monolithic Python applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hlop3z", email = "23062270+hlop3z@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["framework", "kernel", "registry", "modular-monolith", "plugins"]
classifiers = [
    # Tracks the stability policy, not a mood: Beta for as long as the pre-1.0
    # allowance stands (a public element may still break in a minor). It becomes
    # "5 - Production/Stable" in the same release that cuts 1.0, and only once the
    # criteria in [tool.spoc.stability] and the docs' Stability page all hold.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://hlop3z.github.io/spoc/"
Documentation = "https://hlop3z.github.io/spoc/"
Repository = "https://github.com/hlop3z/spoc"
Changelog = "https://github.com/hlop3z/spoc/blob/main/CHANGELOG.md"

# The scaffolder ships in this distribution and needs nothing: every one of its
# build-vs-adopt decisions landed on the standard library, so `dependencies`
# above stays empty. The kernel imports nothing from `spoc.scaffold` or
# `spoc.formats` — both are contained subpackages, and the boundary is pinned
# by the test suite.
[project.scripts]
spoc = "spoc.cli:main"

# The pytest plugin is inert metadata until pytest itself runs: pytest is the
# only importer of `spoc.testing.plugin`, so pytest never becomes a runtime
# dependency and `dependencies` above stays empty.
[project.entry-points.pytest11]
spoc = "spoc.testing.plugin"

# The bare install reads JSON, CSV, and TOML through the standard library and
# costs nothing. Every non-stdlib codec lives behind an extra — these are the
# feature flags; `dependencies` above stays empty.
[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.19.1"] # YAML 1.2, a strict JSON superset
xml = ["xmltodict>=1.0.4"]     # force_list's callable form is what the XML design needs
toml = ["tomli-w>=1.0"]        # stdlib tomllib reads; nothing in it writes
# python-jsonpath carries RFC 9535 + RFC 6901; iregexp-check is what makes the
# RFC's own match()/search() functions available, so conformance is not partial.
query = ["python-jsonpath>=2.2.1", "iregexp-check>=0.1.4"]
full = ["spoc[yaml,xml,toml,query]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/spoc/__about__.py"

# The sdist is the package, its tests, and its history — not the docs site, the
# process artifacts, or the built distributions. README, LICENSE, and pyproject
# are included by hatchling on its own.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

# The stability contract. Every element of the published surface carries exactly
# one tier:
#
#   public       breaking change only in a major release, after deprecation
#   provisional  may break in a minor release; never in a patch
#   internal     may change or vanish in any release, including a patch
#
# Importable names are NOT listed here. Their tier is derived from the source,
# because the source already says it:
#
#   exposed from a plain module, not a package  ->  internal
#   documentation carries the provisional notice ->  provisional
#   anything else exposed from a package         ->  public
#
# So the way to make a name public is to export it from a package's `__all__`,
# and the way to make it provisional is to say so in its docstring. There is no
# third place to edit, and nothing here to keep in step.
#
# What remains is what no static reader can attribute a tier to: a console
# script, a plugin entry point, an extra, a pytest fixture, a config schema, a
# template set. Each carries a `kind:` prefix. A dotted path in this table is a
# mistake and `apicheck` refuses it.
#
# Verified by `cd scripts/py && uv run apicheck ../..` (see .canon/checks.md).
[tool.spoc.stability]
public = [
  "entry-point:pytest11.spoc",
  "extra:full",
  "extra:query",
  "extra:toml",
  "extra:xml",
  "extra:yaml",
  "fixture:spoc_framework",
  "fixture:spoc_isolated",
  "fixture:spoc_tree",
  "schema:config/spoc.toml",
  "script:spoc",
  "template-set:default",
]

# Public and documented, but unsettled: may change incompatibly in a minor
# release. The starter's generated shape is new with this line; it settles
# once it survives a full minor line unchanged.
provisional = [
  "template-set:starter",
]

# What carries no promise, even on a `public` element. Written down rather than
# inferred, so silence is never mistaken for a guarantee.
[tool.spoc.stability.excluded]
# Error *types* and their hierarchy are public; the wording of any message is not.
message-text = true
# `--json` output is public; the human-readable prose rendering of the same
# command is free to change.
prose-output = true
# An extra's name and the capability it enables are public; the versions it
# resolves to are not.
extra-pins = true
# Attribute names and reprs internal to an otherwise-public type.
internal-attributes = true

# Ruff runs on an explicit rule selection, never its defaults: a toolchain bump must
# not silently change what CI enforces (.canon/checks.md is the gate).
# `include` is ruff's default list minus `*.md` — 0.16 began formatting Python inside
# Markdown, which reflows the aligned trailing comments the docs use as annotations.
[tool.ruff]
target-version = "py312"
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — this project is >=3.12; legacy typing spellings are defects
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DTZ", # flake8-datetimez — naive datetimes are a correctness trap
    "RUF", # ruff-specific
]
ignore = [
    # `__all__` is grouped by concern with section comments (Framework, Registry,
    # Identity, …). That grouping is the public surface's table of contents; sorting
    # it alphabetically would flatten a deliberate structure into noise.
    "RUF022",
]

[tool.ty.environment]
root = ["./src"]

# unresolved-import stays on for the published packages. It is ignored only where
# imports genuinely cannot resolve statically: the example project imports its own
# runtime-path package, tests import fixture modules they create in tmp_path,
# scripts/py tools carry their own uv environments, and the docs macros module
# imports from the `docs` group, which the checking environment does not install.
[[tool.ty.overrides]]
include = ["examples/**", "tests/**", "scripts/**", "docs/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The PEP 702 fallback is deliberately dynamic: it patches `__new__`, stamps
# `__deprecated__`, and returns a wrapper typed as the object it wraps. No gradual
# type system models that faithfully — which is a large part of why the decorator
# belongs in the standard library and is only hand-written here to cover 3.12.
# `unresolved-import` is separate: `warnings.deprecated` genuinely does not exist
# on this project's 3.12 floor, and the `try`/`except ImportError` is the point.
# Scoped to the one file, and behind 19 tests that exercise both paths.
[[tool.ty.overrides]]
include = ["src/spoc/core/deprecation.py"]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
unresolved-import = "ignore"

# The pytest plugin executes only inside pytester *subprocesses* (see
# tests/test_testing.py), which the coverage tracer does not measure — its
# behavior is asserted there, so 0% here would be noise, not signal.
[tool.coverage.run]
omit = ["*/spoc/testing/plugin.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our own suite must not auto-load the shipped pytest plugin: entry-point
# plugins import before pytest-cov starts measuring, so loading it here would
# import all of `spoc` early and erase the coverage report. The plugin's
# behavior is proven in-suite through pytester subprocesses, which use their
# own rootdir and do auto-load it.
addopts = "-p no:spoc"

[dependency-groups]
dev = [
    # Devs Tools
    "pytest>=9.0.2",
    # `task test:cov` and `task dev:watch` are gates in .canon/checks.md's
    # neighborhood, so their tools are declared rather than assumed present.
    "pytest-cov>=6.0.0",
    "pytest-watch>=4.2.0",
    # Property-based testing (tests/test_properties.py): universal
    # quantification over the identifier grammar and registry invariants.
    # Dev-only — never reaches the published (empty) dependency set.
    "hypothesis>=6.100",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    # The formats suite exercises the real codecs and simulates a *missing*
    # extra with a stub factory — so the extras must be present for the suite
    # to mean anything. Declared here rather than as a CI flag: `uv sync`
    # installs the dev group by default, so a plain sync gives CI and a laptop
    # the same environment. This never reaches an installer of `spoc` —
    # `dependencies` above stays empty; the extras are opt-in feature flags.
    "spoc[full]",
    # Doc snippet execution (tests/test_docs_examples.py): every Python fence
    # under docs/docs/ runs or carries an explicit skip marker. Lives in `dev`,
    # not `docs`, because the *test suite* imports it — the docs build does not.
    # Adopted via /ai:decide (DECISIONS.md: "Doc snippet execution").
    "pytest-examples>=0.0.15",
]
examples = [
    # HTTP surface for the registry-projection example (never a kernel dependency)
    "fastapi>=0.115",
    # The settings-validation seam's worked example (docs: The Settings File).
    # Pinned directly rather than ridden as fastapi's transitive dependency, so
    # the docs-mirroring test keeps meaning if fastapi's own deps change.
    "pydantic>=2",
]
docs = [
    # Docs Tools
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocstrings[python]>=1.0.0",
    "termynal>=0.13.0",
]
