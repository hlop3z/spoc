[project]
name = "spoc"
dynamic = ["version"]
description = "Component registry and lifecycle for modular Python applications — build your own framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hlop3z", email = "23062270+hlop3z@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["framework", "kernel", "registry", "modular-monolith", "plugins"]
classifiers = [
    # Tracks the stability policy, not a mood: docs/docs/api/stability.md states
    # the criteria this claim rests on.
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    # The platforms the gate actually runs on; the declared set and the gated set
    # are identical by requirement (D42).
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://hlop3z.github.io/spoc/"
Documentation = "https://hlop3z.github.io/spoc/"
Repository = "https://github.com/hlop3z/spoc"
Changelog = "https://github.com/hlop3z/spoc/blob/main/CHANGELOG.md"

# The scaffolder ships in this distribution and needs nothing (D07). The kernel
# imports neither `spoc.scaffold` nor `spoc.formats`; both are contained
# subpackages whose boundary the test suite pins (D17).
[project.scripts]
spoc = "spoc.cli:main"

# Inert metadata until pytest itself runs: pytest is the only importer of
# `spoc.testing.plugin`, so pytest never becomes a runtime dependency.
[project.entry-points.pytest11]
spoc = "spoc.testing.plugin"

# The bare install reads JSON, CSV, and TOML through the standard library. Every
# non-stdlib codec lives behind an extra — these are the feature flags, which is
# what keeps `dependencies` above empty (D17).
[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.19.1"] # D16
xml = ["xmltodict>=1.0.4"]     # D14
toml = ["tomli-w>=1.0"]        # stdlib tomllib reads; nothing in it writes
query = ["python-jsonpath>=2.2.1", "iregexp-check>=0.1.4"] # D15
full = ["spoc[yaml,xml,toml,query]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/spoc/__about__.py"

# The sdist is the package, its tests, and its history — not the docs site, the
# process artifacts, or the built distributions. README, LICENSE, and pyproject
# are included by hatchling on its own.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

# The stability contract. Tier definitions, and the rule that derives a tier for
# an importable name from its source, live in docs/docs/api/stability.md; what
# `apicheck` fails on lives in .canon/checks.md. This table holds only what no
# static reader can attribute a tier to — a console script, a plugin entry point,
# an extra, a pytest fixture, a config schema, a template set — each behind a
# `kind:` prefix. A dotted path here is a mistake and `apicheck` refuses it.
[tool.spoc.stability]
public = [
  "entry-point:pytest11.spoc",
  "extra:full",
  "extra:query",
  "extra:toml",
  "extra:xml",
  "extra:yaml",
  "fixture:spoc_framework",
  "fixture:spoc_isolated",
  "fixture:spoc_tree",
  "schema:config/spoc.toml",
  # The registry projection's document shape, published as JSON Schema at
  # spoc/projection/schema.json. The document is the contract, not the
  # dataclass that produces it: `format_version` in the document is what a
  # consumer branches on, and it moves only when the shape does (D53).
  "schema:projection/document",
  "script:spoc",
  "template-set:default",
]

# Public and documented, but unsettled: may change incompatibly in a minor
# release. The starter's generated shape settles once it survives a full minor
# line unchanged (D30).
provisional = [
  "template-set:starter",
]

# What carries no promise, even on a `public` element. Written down rather than
# inferred, so silence is never mistaken for a guarantee.
[tool.spoc.stability.excluded]
# Error *types* and their hierarchy are public; the wording of any message is not.
message-text = true
# `--json` output is public; the human-readable prose rendering of the same
# command is free to change.
prose-output = true
# An extra's name and the capability it enables are public; the versions it
# resolves to are not.
extra-pins = true
# Attribute names and reprs internal to an otherwise-public type.
internal-attributes = true

# Ruff runs on an explicit rule selection, never its defaults: a toolchain bump must
# not silently change what CI enforces (.canon/checks.md is the gate).
# `include` is ruff's default list minus `*.md` — 0.16 began formatting Python inside
# Markdown, which reflows the aligned trailing comments the docs use as annotations.
[tool.ruff]
target-version = "py312"
# The conformance fixture is a standalone project, not repo source: it resolves
# `framework` from its own root and carries pyright-only constructs. Its own gate
# checks it with three type checkers (D45), so linting it from here would only
# mislint it. ty and mypy below exclude it for this same reason.
extend-exclude = ["tests/conformance"]
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — this project is >=3.12; legacy typing spellings are defects
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DTZ", # flake8-datetimez — naive datetimes are a correctness trap
    "PYI", # flake8-pyi — the generated stubs are linted like any other source
    "RUF", # ruff-specific
]
ignore = [
    # `__all__` is grouped by concern with section comments (Framework, Registry,
    # Identity, …). That grouping is the public surface's table of contents; sorting
    # it alphabetically would flatten a deliberate structure into noise.
    "RUF022",
]

[tool.ty.environment]
root = ["./src"]

# See the ruff exclusion above.
[tool.ty.src]
exclude = ["tests/conformance"]

# unresolved-import stays on for the published packages. It is ignored only where
# imports genuinely cannot resolve statically: the example project imports its own
# runtime-path package, tests import fixture modules they create in tmp_path,
# scripts/py tools carry their own uv environments, and the docs macros module
# imports from the `docs` group, which the checking environment does not install.
[[tool.ty.overrides]]
include = ["examples/**", "tests/**", "scripts/**", "docs/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The PEP 702 fallback is deliberately dynamic: it patches `__new__`, stamps
# `__deprecated__`, and returns a wrapper typed as the object it wraps, which no
# gradual type system models faithfully (D26). `unresolved-import` is separate:
# `warnings.deprecated` genuinely does not exist on this project's 3.12 floor, and
# the `try`/`except ImportError` is the point. Scoped to the one file, and behind
# 19 tests that exercise both paths.
[[tool.ty.overrides]]
include = ["src/spoc/core/deprecation.py"]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
unresolved-import = "ignore"

# The second reading of `src/`, beside ty: this package ships `py.typed` and claims
# `Typing :: Typed`, so the published annotations are verified by the checkers users
# actually run (D45). Strict from the first commit rather than ratcheted — the gap
# was 34 errors, small enough to close once instead of twice. Where the two checkers
# disagree, the disagreement is a finding about the source, never something to fix
# by loosening whichever one reported it.
[tool.mypy]
strict = true
files = ["src/spoc"]
# The supported floor, not the interpreter that happens to run the check — an
# error that only appears on 3.14 is not a 3.12 user's problem to discover.
python_version = "3.12"
# See the ruff exclusion above.
exclude = ["tests/conformance"]

# The same escape ty carries for the deprecation fallback (D26), scoped to the same
# one file. Only the codes the dynamism actually raises: patching `__new__` on an
# arbitrary class (assignment, attr-defined, call-overload, comparison-overlap) and
# calling and returning an arbitrary `_T` through `functools.wraps` (arg-type,
# operator, return-value). Everything else stays strict here — the file's own
# annotations are checked like any other module's, and its nested functions carry them.
[[tool.mypy.overrides]]
module = ["spoc.core.deprecation"]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "comparison-overlap",
    "operator",
    "return-value",
]

# The pytest plugin executes only inside pytester *subprocesses* (see
# tests/test_testing.py), which the coverage tracer does not measure — its
# behavior is asserted there, so 0% here would be noise, not signal.
[tool.coverage.run]
omit = ["*/spoc/testing/plugin.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our own suite must not auto-load the shipped pytest plugin: entry-point
# plugins import before pytest-cov starts measuring, so loading it here would
# import all of `spoc` early and erase the coverage report. The plugin's
# behavior is proven in-suite through pytester subprocesses, which use their
# own rootdir and do auto-load it.
addopts = "-p no:spoc"

# Every dev tool below is dev-only by design: `dependencies` above stays empty and
# no downstream framework inherits any of them.
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    # `task test:cov` and `task dev:watch` are gates in .canon/checks.md's
    # neighborhood, so their tools are declared rather than assumed present.
    "pytest-cov>=6.0.0",
    "pytest-watch>=4.2.0",
    # Property-based testing (tests/test_properties.py): universal quantification
    # over the identifier grammar and registry invariants (D39).
    "hypothesis>=6.100",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    # The generated-stub conformance gate (tests/test_conformance.py) runs three
    # type checkers over one fixture, because a stub that passes only ty — beta at
    # 0.0.x, and in no user's editor — could still fail everyone (D45). pyright is
    # what VS Code runs through Pylance, which makes it the authority on the
    # autocomplete claim (D46); mypy is the second independent reading.
    "mypy>=1.13",
    "pyright>=1.1.390",
    # `xmltodict` ships no types of its own, and the XML codec is the one place
    # `src/` reads a third-party API. Stub-only distribution (D14).
    "types-xmltodict>=0.14",
    # The formats suite exercises the real codecs and simulates a *missing* extra
    # with a stub factory — so the extras must be present for the suite to mean
    # anything. Declared here rather than as a CI flag: `uv sync` installs the dev
    # group by default, so a plain sync gives CI and a laptop the same environment.
    "spoc[full]",
    # Doc snippet execution (tests/test_docs_examples.py): every Python fence under
    # docs/docs/ runs or carries an explicit skip marker (D32). Lives in `dev`, not
    # `docs`, because the *test suite* imports it — the docs build does not.
    "pytest-examples>=0.0.15",
    # The projection's schema is hand-written, so the suite is what proves the
    # producer and the published schema still agree (D54).
    "jsonschema>=4.26",
]
examples = [
    # HTTP surface for the registry-projection example (never a kernel dependency).
    # FastAPI because it is the transport the starter's worked recipe uses (D30).
    "fastapi>=0.115",
    # The settings-validation seam's worked example (D31). Pinned directly rather
    # than ridden as fastapi's transitive dependency, so the docs-mirroring test
    # keeps meaning if fastapi's own deps change.
    "pydantic>=2",
]
docs = [
    # Docs Tools
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocstrings[python]>=1.0.0",
    "termynal>=0.13.0",
]
