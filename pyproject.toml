[project]
name = "spoc"
dynamic = ["version"]
description = "Registry-first runtime kernel for modular monolithic Python applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hlop3z", email = "23062270+hlop3z@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["framework", "kernel", "registry", "modular-monolith", "plugins"]
classifiers = [
    # Tracks the stability policy, not a mood: Beta for as long as the pre-1.0
    # allowance stands (a public element may still break in a minor). It becomes
    # "5 - Production/Stable" in the same release that cuts 1.0, and only once the
    # criteria in [tool.spoc.stability] and the docs' Stability page all hold.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://hlop3z.github.io/spoc/"
Documentation = "https://hlop3z.github.io/spoc/"
Repository = "https://github.com/hlop3z/spoc"
Changelog = "https://github.com/hlop3z/spoc/blob/main/CHANGELOG.md"

# The scaffolder ships in this distribution and needs nothing: every one of its
# build-vs-adopt decisions landed on the standard library, so `dependencies`
# above stays empty. The kernel imports nothing from `spoc.scaffold` or
# `spoc.formats` — both are contained subpackages, and the boundary is pinned
# by the test suite.
[project.scripts]
spoc = "spoc.cli:main"

# The pytest plugin is inert metadata until pytest itself runs: pytest is the
# only importer of `spoc.testing.plugin`, so pytest never becomes a runtime
# dependency and `dependencies` above stays empty.
[project.entry-points.pytest11]
spoc = "spoc.testing.plugin"

# The bare install reads JSON, CSV, and TOML through the standard library and
# costs nothing. Every non-stdlib codec lives behind an extra — these are the
# feature flags; `dependencies` above stays empty.
[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.19.1"] # YAML 1.2, a strict JSON superset
xml = ["xmltodict>=1.0.4"]     # force_list's callable form is what the XML design needs
toml = ["tomli-w>=1.0"]        # stdlib tomllib reads; nothing in it writes
# python-jsonpath carries RFC 9535 + RFC 6901; iregexp-check is what makes the
# RFC's own match()/search() functions available, so conformance is not partial.
query = ["python-jsonpath>=2.2.1", "iregexp-check>=0.1.4"]
full = ["spoc[yaml,xml,toml,query]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/spoc/__about__.py"

# The sdist is the package, its tests, and its history — not the docs site, the
# process artifacts, or the built distributions. README, LICENSE, and pyproject
# are included by hatchling on its own.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

# The stability contract. Every element of the published surface carries exactly
# one tier, and this table is the single source of truth for which — the docs
# page, the provisional warnings, and `apicheck` are all projections of it.
# An element that appears nowhere here is `internal` by default: absence of a
# promise is never read as a promise.
#
#   public       breaking change only in a major release, after deprecation
#   provisional  may break in a minor release; never in a patch
#   internal     may change or vanish in any release, including a patch
#
# Dotted entries are Python paths. Everything a dotted path cannot name carries a
# `kind:` prefix — `script:`, `entry-point:`, `fixture:`, `extra:`, `schema:`,
# `template-set:` — because a console script and a pytest fixture are things a
# consumer depends on just as hard as an import.
#
# Verified by `cd scripts/py && uv run apicheck ../..` (see .canon/checks.md).
[tool.spoc.stability]
public = [
  "entry-point:pytest11.spoc",
  "extra:full",
  "extra:query",
  "extra:toml",
  "extra:xml",
  "extra:yaml",
  "fixture:spoc_framework",
  "fixture:spoc_isolated",
  "fixture:spoc_tree",
  "schema:config/spoc.toml",
  "script:spoc",
  "spoc.AppNotFoundError",
  "spoc.CircularDependencyError",
  "spoc.Component",
  "spoc.ComponentKindMismatchError",
  "spoc.Config",
  "spoc.ConfigurationError",
  "spoc.DuplicateComponentError",
  "spoc.Framework",
  "spoc.Identifier",
  "spoc.IdentityDivergenceError",
  "spoc.InvalidSegmentError",
  "spoc.KindSpec",
  "spoc.MalformedIdentifierError",
  "spoc.MetadataContractError",
  "spoc.MissingModuleError",
  "spoc.MissingNameError",
  "spoc.Registry",
  "spoc.SpocError",
  "spoc.UnknownKindError",
  "spoc.UnknownNamespaceError",
  "spoc.UnknownObjectError",
  "spoc.UnmarkableObjectError",
  "spoc.UnresolvedReferenceError",
  "spoc.__version__",
  "spoc.component",
  "spoc.compose",
  "spoc.diagnostics.CheckReport",
