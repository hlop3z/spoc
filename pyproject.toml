internal = [
  "spoc.cli.main",
  "spoc.diagnostics.cli.register",
  "spoc.diagnostics.core.CheckReport",
  "spoc.diagnostics.core.Finding",
  "spoc.diagnostics.core.RecordInfo",
  "spoc.diagnostics.core.check",
  "spoc.diagnostics.core.explain",
  "spoc.diagnostics.core.list_records",
  "spoc.diagnostics.locate.DEFAULT_FRAMEWORK_REF",
  "spoc.diagnostics.locate.LocateError",
  "spoc.diagnostics.locate.locate_framework",
  "spoc.scaffold.cli.register",
  "spoc.testing.core.MissingDependencyError",
  "spoc.testing.core.import_state",
  "spoc.testing.core.isolated",
  "spoc.testing.core.mode",
  "spoc.testing.plugin.spoc_framework",
  "spoc.testing.plugin.spoc_isolated",
  "spoc.testing.plugin.spoc_tree",
  "spoc.testing.tree.ProjectTree",
]

# What carries no promise, even on a `public` element. Written down rather than
# inferred, so silence is never mistaken for a guarantee.
[tool.spoc.stability.excluded]
# Error *types* and their hierarchy are public; the wording of any message is not.
message-text = true
# `--json` output is public; the human-readable prose rendering of the same
# command is free to change.
prose-output = true
# An extra's name and the capability it enables are public; the versions it
# resolves to are not.
extra-pins = true
# Attribute names and reprs internal to an otherwise-public type.
internal-attributes = true

# Ruff runs on an explicit rule selection, never its defaults: a toolchain bump must
# not silently change what CI enforces (.canon/checks.md is the gate).
# `include` is ruff's default list minus `*.md` — 0.16 began formatting Python inside
# Markdown, which reflows the aligned trailing comments the docs use as annotations.
[tool.ruff]
target-version = "py312"
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — this project is >=3.12; legacy typing spellings are defects
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DTZ", # flake8-datetimez — naive datetimes are a correctness trap
    "RUF", # ruff-specific
]
ignore = [
    # `__all__` is grouped by concern with section comments (Framework, Registry,
    # Identity, …). That grouping is the public surface's table of contents; sorting
    # it alphabetically would flatten a deliberate structure into noise.
    "RUF022",
]

[tool.ty.environment]
root = ["./src"]

# unresolved-import stays on for the published packages. It is ignored only where
# imports genuinely cannot resolve statically: the example project imports its own
# runtime-path package, tests import fixture modules they create in tmp_path,
# scripts/py tools carry their own uv environments, and the docs macros module
# imports from the `docs` group, which the checking environment does not install.
[[tool.ty.overrides]]
include = ["examples/**", "tests/**", "scripts/**", "docs/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The PEP 702 fallback is deliberately dynamic: it patches `__new__`, stamps
# `__deprecated__`, and returns a wrapper typed as the object it wraps. No gradual
# type system models that faithfully — which is a large part of why the decorator
# belongs in the standard library and is only hand-written here to cover 3.12.
# `unresolved-import` is separate: `warnings.deprecated` genuinely does not exist
# on this project's 3.12 floor, and the `try`/`except ImportError` is the point.
# Scoped to the one file, and behind 19 tests that exercise both paths.
[[tool.ty.overrides]]
include = ["src/spoc/core/deprecation.py"]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
unresolved-import = "ignore"

# The pytest plugin executes only inside pytester *subprocesses* (see
# tests/test_testing.py), which the coverage tracer does not measure — its
# behavior is asserted there, so 0% here would be noise, not signal.
[tool.coverage.run]
omit = ["*/spoc/testing/plugin.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our own suite must not auto-load the shipped pytest plugin: entry-point
# plugins import before pytest-cov starts measuring, so loading it here would
# import all of `spoc` early and erase the coverage report. The plugin's
# behavior is proven in-suite through pytester subprocesses, which use their
# own rootdir and do auto-load it.
addopts = "-p no:spoc"

[dependency-groups]
dev = [
    # Devs Tools
    "pytest>=9.0.2",
    # `task test:cov` and `task dev:watch` are gates in .canon/checks.md's
    # neighborhood, so their tools are declared rather than assumed present.
    "pytest-cov>=6.0.0",
    "pytest-watch>=4.2.0",
    # Property-based testing (tests/test_properties.py): universal
    # quantification over the identifier grammar and registry invariants.
    # Dev-only — never reaches the published (empty) dependency set.
    "hypothesis>=6.100",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    # The formats suite exercises the real codecs and simulates a *missing*
    # extra with a stub factory — so the extras must be present for the suite
    # to mean anything. Declared here rather than as a CI flag: `uv sync`
    # installs the dev group by default, so a plain sync gives CI and a laptop
    # the same environment. This never reaches an installer of `spoc` —
    # `dependencies` above stays empty; the extras are opt-in feature flags.
    "spoc[full]",
]
examples = [
    # HTTP surface for the registry-projection example (never a kernel dependency)
    "fastapi>=0.115",
]
docs = [
    # Docs Tools
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocstrings[python]>=1.0.0",
    "termynal>=0.13.0",
]
