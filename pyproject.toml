provisional = [
  "spoc.scaffold.BoundExceededError",
  "spoc.scaffold.Cache",
  "spoc.scaffold.DirectoryCache",
  "spoc.scaffold.EnumerableSource",
  "spoc.scaffold.Fetcher",
