[project]
name = "workshop"
version = "0.0.0"
description = "Python workspace for utility CLIs"
requires-python = ">=3.12"
dependencies = []

# The workspace root is a member but is never built or installed — it exists to
# hold the shared lockfile and the member globs.
[tool.uv]
package = false

# Members are installed by `uv sync --all-packages`, which is what the Taskfile and
# CI already run — listing them here as well would duplicate the `tools/*` glob
# below as a hand-maintained list, and it would rot the first time a tool is added.
# pytest is the exception: it belongs to no single member, since one run covers
# every tool's tests.
[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv.workspace]
members = ["tools/*"]
# lab/ holds single-file PEP 723 scripts that carry their own inline
# dependencies. They are deliberately NOT workspace members: a member must have
# a pyproject.toml and enters the shared lockfile, which is the opposite of
# disposable.
exclude = ["lab"]
